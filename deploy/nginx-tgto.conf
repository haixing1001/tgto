# ============ Tgto Nginx 反代示例（VPS 公网 + HTTPS） ============
# 1) 安装： apt install -y nginx && certbot --nginx -d tgto.example.com
# 2) 将本文件软链到 /etc/nginx/sites-enabled/tgto 后 nginx -t && systemctl reload nginx
# 3) 建议同时启用防火墙： ufw allow 80,443/tcp && ufw allow 22/tcp && ufw enable
#    （9058 不必对公网开放，仅本机回源）

server {
    listen 80;
    server_name tgto.example.com;   # ← 改成你的域名
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name tgto.example.com;   # ← 改成你的域名

    # Certbot 自动签发的证书（certbot --nginx 后自动填充）
    ssl_certificate     /etc/letsencrypt/live/tgto.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tgto.example.com/privkey.pem;

    # 单二进制上传大文件（STRM 目录/日志导出）
    client_max_body_size 512m;

    location / {
        proxy_pass         http://127.0.0.1:9058;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
