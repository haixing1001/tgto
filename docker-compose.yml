services:
  tgto:
    # 镜像由 GitHub Actions 在每次推送 main / v* tag 时自动构建并推送到 GHCR，
    # 同时提供 linux/amd64 与 linux/arm64，compose 会自动选择本机架构。
    # 固定版本：在 .env 里设置 TGTO_IMAGE=ghcr.io/haixing1001/tgto:sha-xxxxxxxx
    image: ${TGTO_IMAGE:-ghcr.io/haixing1001/tgto:latest}
    container_name: tgto
    restart: unless-stopped
    # latest 标签配合 always，让 `docker compose up -d` 总能拿到最新镜像；
    # 固定了版本号时可改成 missing，避免每次重复拉取。
    pull_policy: always
    ports:
      # 宿主机端口可通过 .env 的 TGTO_PORT 调整（默认 9058）
      - "${TGTO_PORT:-9058}:9058"
    environment:
      # 登录账号（沿用原版 ENV 命名）
      ENV_WEB_PASSPORT: ${TGTO_USER:-admin}
      # 登录密码（生产环境务必通过 .env 修改，公网部署不要使用默认 123）
      ENV_WEB_PASSWORD: ${TGTO_PASSWORD:-123}
      # Go 运行时内存上限（VPS 可适当调大，如 128MiB）
      GOMEMLIMIT: ${TGTO_MEMLIMIT:-64MiB}
    volumes:
      - ./db:/app/db        # SQLite 数据库（WAL 模式）
      - ./strm:/app/strm    # STRM 文件树输出
      - ./data:/app/data    # 本地媒体源 / 整理沙盒目录
